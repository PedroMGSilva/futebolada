services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      waha:
        condition: service_started
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI}
      SESSION_SECRET: ${SESSION_SECRET}
      WAHA_BASE_URL: ${WAHA_BASE_URL}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_CHAT_ID: ${WAHA_CHAT_ID}
    ports:
      # Loopback only. Caddy reverse proxies to app:3000 over the web network,
      # so this mapping is not what serves the site; publishing it on 0.0.0.0
      # exposed the app directly over plain HTTP, bypassing Caddy and TLS.
      - "127.0.0.1:3000:3000"
    networks:
      - web
      - internal

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: "on-failure"
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
    command: npm run migrate
    networks:
      - internal

  db:
    image: postgres:17.5
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Loopback only. In production app and migrate reach the database over
      # the internal network as DB_HOST=db; publishing on 0.0.0.0 exposed
      # Postgres to the internet behind nothing but DB_PASSWORD. Kept published
      # for local development, where npm run dev connects to localhost:5432.
      # To reach it from outside, tunnel: ssh -L 5432:localhost:5432 root@<host>
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_NAME} -U ${DB_USER}"]
      interval: 5s
      retries: 5
    networks:
      - internal

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - app

  waha:
    image: devlikeapro/waha:arm-2026.7.2
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_ENABLED: ${WAHA_DASHBOARD_ENABLED}
      WHATSAPP_SWAGGER_ENABLED: ${WHATSAPP_SWAGGER_ENABLED}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
    ports:
      # Loopback only. In production the app reaches waha over the internal
      # network by service name; publishing on 0.0.0.0 put the WhatsApp API on
      # the internet behind nothing but the API key. Kept published for local
      # development, where npm run dev talks to localhost:3001 from the host.
      - "127.0.0.1:3001:3000"
    volumes:
      - waha_config:/app/config
      - waha_sessions:/app/.sessions
    networks:
      - internal

volumes:
  db-data:
  caddy_data:
  caddy_config:
  waha_config:
  waha_sessions:

networks:
  web:
  internal:
